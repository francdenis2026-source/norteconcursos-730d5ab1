name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run automated tests
        run: bun run test

      # Keep collecting diagnostics after a failing test step. The job remains
      # failed, so this never turns a red test suite into a green CI result.
      - name: TypeScript typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: Production build
        if: ${{ !cancelled() }}
        run: bun run build
