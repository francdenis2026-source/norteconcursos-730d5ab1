<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="Player de videoaulas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b2a"/><stop offset=".6" stop-color="#143047"/><stop offset="1" stop-color="#0a1620"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2c5a73" stop-opacity=".55"/><stop offset="1" stop-color="#2c5a73" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1d77c"/><stop offset=".5" stop-color="#d8b238"/><stop offset="1" stop-color="#b8901f"/></linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect width="720" height="240" fill="url(#bg)"/>
  <rect width="720" height="240" fill="url(#glow)"/>
  <g transform="translate(100 -12) scale(.72)">
  <!-- quadro de aula ao fundo -->
  <g opacity=".85">
    <rect x="70" y="28" width="580" height="150" rx="10" fill="#0a1824" stroke="#25465c" stroke-width="2"/>
    <g stroke="#4f86a1" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"><path d="M104 66h150"/><path d="M104 92h210"/><path d="M104 118h120"/></g>
    <g stroke="#d8b238" stroke-opacity=".65" stroke-width="3" stroke-linecap="round"><path d="M104 144h96"/></g>
    <circle cx="560" cy="102" r="34" fill="none" stroke="#4f86a1" stroke-opacity=".45" stroke-width="3"/>
    <path d="M542 102h36M560 84v36" stroke="#4f86a1" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- play -->
  <g filter="url(#drop)">
    <circle cx="360" cy="102" r="46" fill="#05090e" fill-opacity=".45"/>
    <circle cx="360" cy="102" r="38" fill="url(#gold)"/>
    <circle cx="360" cy="102" r="38" fill="none" stroke="#fff4c8" stroke-opacity=".55" stroke-width="2"/>
    <path d="M349 83v38l33-19z" fill="#2a1d00" stroke="#2a1d00" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <!-- progresso -->
  <rect x="70" y="196" width="580" height="6" rx="3" fill="#fff" fill-opacity=".22"/>
  <rect x="70" y="196" width="250" height="6" rx="3" fill="url(#gold)"/>
  <circle cx="320" cy="199" r="9" fill="#fff4c8"/><circle cx="320" cy="199" r="5.5" fill="#d8b238"/>
  </g>
</svg>
