<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14171d">
<title>Sem conexão — Norte Concurso</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #14171d; color: #eef0f3; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 420px; text-align: center; }
  img { width: 72px; height: 72px; margin-bottom: 16px; }
  h1 { margin: 0 0 8px; font-size: 1.4rem; }
  p { margin: 0 0 12px; line-height: 1.5; color: #b6bcc6; }
  button { margin-top: 8px; padding: 12px 22px; border: 0; border-radius: 12px; background: #eef0f3; color: #14171d; font-size: 1rem; font-weight: 600; cursor: pointer; }
  small { display: block; margin-top: 16px; color: #8a919c; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-256.png" alt="" width="72" height="72">
  <h1>Você está sem conexão</h1>
  <p>Não foi possível abrir esta página agora. O que você já respondeu está salvo e continua na sua conta.</p>
  <p>Conecte-se à internet para continuar estudando.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
  <small>Quando a conexão voltar, esta tela recarrega sozinha.</small>
</main>
<script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
